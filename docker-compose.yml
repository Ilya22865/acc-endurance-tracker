services:
  postgres:
    image: postgres:16
    container_name: endurancehub-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: endurancehub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - endurancehub-db-data:/var/lib/postgresql/data

volumes:
  endurancehub-db-data: